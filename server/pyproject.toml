[project]
name = "server"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # not fastapi[standard]: that pulls in fastapi-cli and, through it, rich,
    # typer, pygments, sentry-sdk and a cloud uploader - a command line we
    # never run, since the server is started with uvicorn directly
    "fastapi>=0.121.0",
    "uvicorn[standard]>=0.34.0",
    # what the upload endpoint needs out of [standard]
    "python-multipart>=0.0.20",
    "laserorm[postgres,sqlite,mysql]",
    "python-dotenv>=1.2.1",
    # the API client sends requests and proxies sockets on the user's behalf
    "httpx>=0.28.1",
    "websockets>=15.0",
    # MQTT is the third protocol an API connection can speak
    "paho-mqtt>=2.1.0",
]

[tool.uv]
dev-dependencies = [
    "black>=25.9.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.2.1",
    "faker>=38.2.0",
    # an in-process broker, so the MQTT tests talk to a real one
    "amqtt>=0.11.0",
]

[tool.uv.sources]
laserorm = { git = "https://github.com/ArnabChatterjee20k/LaserORM.git" }

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*", "*Tests"]
python_functions = ["test_*"]
asyncio_mode = "auto"
