services:
  datapilot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: datapilot
    ports:
      - "${PORT:-8000}:8000"
    environment:
      MODE: PROD
      # config database and uploaded SQLite files, kept on the mounted volume
      DB_PATH: /app/server/data/config.db
      BUCKET_DIR: /app/server/data/buckets
      # hard cap on rows a single query may return
      MAX_ROWS: ${MAX_ROWS:-5000}
    volumes:
      - ./data:/app/server/data
    # `localhost` inside this container is this container, so a database running
    # on the host - or in another compose project - is reached through the host
    # gateway. To reach a sibling container directly instead, put it on the same
    # network (`docker network connect <network> datapilot`) and use its name.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    # the image carries no curl, so this is the same check the Dockerfile makes
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
