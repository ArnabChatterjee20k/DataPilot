services:
  datapilot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: datapilot
    ports:
      - "${PORT:-8000}:8000"
    environment:
      MODE: PROD
      # config database and uploaded SQLite files, kept on the mounted volume
      DB_PATH: /app/server/data/config.db
      BUCKET_DIR: /app/server/data/buckets
      # hard cap on rows a single query may return
      MAX_ROWS: ${MAX_ROWS:-5000}
    volumes:
      - ./data:/app/server/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
